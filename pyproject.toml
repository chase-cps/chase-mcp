[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chase-mcp"
version = "0.1.0"
description = "MCP server exposing the contract operations of CHASE as agent-callable tools"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Yifeng Xiao", email = "yifengx@berkeley.edu" }]
requires-python = ">=3.10"
dependencies = [
    "chase-cps>=0.1",
    "mcp>=2,<3",
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
chase-mcp = "chase_mcp.server:main"

[project.urls]
Homepage = "https://chase-cps.github.io"
Repository = "https://github.com/chase-cps/chase-mcp"
Issues = "https://github.com/chase-cps/chase-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["chase_mcp"]
