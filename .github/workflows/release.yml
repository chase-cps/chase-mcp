name: Release

# Builds the chase-mcp package.
# - Manual run: the package is uploaded to TestPyPI, with the version
#   X.Y.Z.devN (N is the number of the run), so that each run can be uploaded.
# - Tag v*: the package is uploaded to PyPI.
# Both use trusted publishing: the PyPI (and TestPyPI) project must list this
# repository, this workflow (release.yml), and the environment (pypi, testpypi).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version"
          grep -q "__version__ = \"$version\"" chase_mcp/__init__.py

      - name: Use a development version on TestPyPI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python3 - "pyproject.toml chase_mcp/__init__.py" "${{ github.run_number }}" <<'PY'
          import re, sys
          files, run = sys.argv[1].split(), sys.argv[2]
          for f in files:
              s = open(f).read()
              s = re.sub(r'^(version|__version__) = "([^"]+)"', rf'\1 = "\2.dev{run}"', s, flags=re.M)
              open(f, "w").write(s)
          PY

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
