name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chase-cps from source
        run: |
          sudo apt-get update && sudo apt-get install -y uuid-dev
          pip install "chase-cps @ git+https://github.com/chase-cps/chase@master"

      - name: Cache the back ends
        uses: actions/cache@v4
        with:
          path: ~/.chase
          key: chase-tools-nusmv-2.6.0

      - name: Install NuSMV with chase-cps install
        run: test -x ~/.chase/bin/NuSMV || chase-cps install nusmv

      - name: Install and test
        run: |
          pip install ".[test]"
          pytest -q
