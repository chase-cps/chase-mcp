name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The contract-ops branch is tested with the contract-ops branch of chase,
      # the others with its master.
      - name: Install chase-cps from source
        env:
          CHASE_REF: ${{ github.ref_name == 'contract-ops' && 'contract-ops' || 'master' }}
        run: |
          sudo apt-get update && sudo apt-get install -y uuid-dev libxml2 libedit2 libboost-dev
          pip install "chase-cps @ git+https://github.com/chase-cps/chase@$CHASE_REF"

      - name: Cache the back ends
        uses: actions/cache@v4
        with:
          path: ~/.chase
          key: chase-tools-nuxmv-2.2.0-slugs

      - name: Install nuXmv and slugs with chase-cps install
        run: |
          test -x ~/.chase/bin/nuXmv || chase-cps install nuxmv --accept-license
          test -e ~/.chase/bin/slugs || chase-cps install slugs

      - name: Install and test
        run: |
          pip install ".[test]"
          pytest -q
